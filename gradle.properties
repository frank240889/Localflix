#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Localflix
# Build only Android + iOS while we focus on mobile.
# Set to true (and re-sync) to bring back the desktop (jvm) and web (js/wasmJs) targets
# plus the :desktopApp and :webApp modules. One-off: ./gradlew build -Plocalflix.allTargets=true
localflix.allTargets=false
